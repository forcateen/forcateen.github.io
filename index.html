<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeGo ⚡ Força Teen</title>
<meta name="theme-color" content="#0a12a8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1ZBTeeudN0SQNfm3APAvJoaxS1xEWhg2J">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1ZBTeeudN0SQNfm3APAvJoaxS1xEWhg2J">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WeGo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0d1ed4; font-family: system-ui, -apple-system, sans-serif; }
  .splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: #fff; text-align: center; padding: 24px;
    background: radial-gradient(rgba(255,255,255,.08) 1.2px, transparent 1.5px) 0 0 / 7px 7px, linear-gradient(160deg, #1a33f0, #0716a0);
  }
  .splash img { width: 140px; height: 140px; filter: drop-shadow(0 0 18px rgba(107,229,46,.6)); animation: pulsa 1.2s ease-in-out infinite; }
  .splash b { font-size: 36px; letter-spacing: .02em; }
  .splash small { opacity: .8; font-size: 15px; }
  @keyframes pulsa { 50% { transform: scale(1.06); } }
  #erro { display: none; max-width: 300px; line-height: 1.4; }
  #erro button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; font-size: 16px; background: #6be52e; color: #07108c; }
</style>
</head>
<body>
<div class="splash">
  <img src="logo.svg" alt="">
  <b>WeGo</b>
  <small id="msg">Carregando...</small>
  <div id="erro">Não deu pra conectar agora. Confere a internet e tenta de novo.<br><button onclick="location.reload()">Tentar de novo</button></div>
</div>
<script>
  // O "salão" do WeGo: esta página abre na hora e busca a tela do app na "cozinha" (Google Apps Script).
  var API = 'https://script.google.com/macros/s/AKfycby_w7m1eiD_gHxD5GV0OdPoOHP89R3KsM2xwqJN1mObH53_ihz47rF3HHNzGU-VjoI6/exec';
  var CHAVE = 'wego_pagina';

  function guardar(html) { try { localStorage.setItem(CHAVE, html); } catch (e) {} }

  function buscar() {
    return fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'pagina', args: [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.erro || 'erro'); guardar(j.r); return j.r; });
  }

  function montar(html, atualizarDepois) {
    var extra =
      '<script>window.WEGO_API=' + JSON.stringify(API) + ';' +
      'if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}' +
      (atualizarDepois
        ? 'setTimeout(function(){fetch(WEGO_API,{method:"POST",body:JSON.stringify({fn:"pagina",args:[]})}).then(function(r){return r.json();}).then(function(j){if(j.ok){try{localStorage.setItem("' + CHAVE + '",j.r);}catch(e){}}}).catch(function(){});},5000);'
        : '') +
      '<\/script>' +
      '<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a12a8">' +
      '<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1ZBTeeudN0SQNfm3APAvJoaxS1xEWhg2J"><link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1ZBTeeudN0SQNfm3APAvJoaxS1xEWhg2J">' +
      '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
      '<meta name="apple-mobile-web-app-title" content="WeGo">';
    html = html.replace('<base target="_top">', '').replace('<head>', '<head>' + extra);
    document.open();
    document.write(html);
    document.close();
  }

  var salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) {}

  if (salvo) {
    // Abre na hora com a versão guardada no celular e atualiza por trás pra próxima vez.
    montar(salvo, true);
  } else {
    buscar().then(function (html) { montar(html, false); }).catch(function () {
      document.getElementById('msg').style.display = 'none';
      document.getElementById('erro').style.display = 'block';
    });
  }
</script>
</body>
</html>
