<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Força Teen</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1nL_BWieThlbpY-YCyEgXyW2W0kLHZixM">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Força Teen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0b; font-family: system-ui, -apple-system, sans-serif; }
  .splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: #fff; text-align: center; padding: 24px;
    background: #0b0b0b;
  }
  .splash .marca { width: 150px; height: 150px; overflow: visible; }
  .splash .marca .tr { fill: none; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: desenha 2.4s ease-in-out infinite; }
  .splash .marca .bv { filter: drop-shadow(0 0 6px rgba(107,229,46,.9)) drop-shadow(0 0 16px rgba(107,229,46,.45)); animation: brilho 2.4s ease-in-out infinite; }
  @keyframes desenha { 0% { stroke-dashoffset: 300; } 45% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes brilho { 0%, 40% { filter: drop-shadow(0 0 4px rgba(107,229,46,.6)); } 55% { filter: drop-shadow(0 0 10px rgba(107,229,46,1)) drop-shadow(0 0 26px rgba(107,229,46,.7)); } 80% { filter: drop-shadow(0 0 6px rgba(107,229,46,.8)); } }
  .splash b { font-size: 34px; letter-spacing: .02em; margin-top: 6px; }
  .splash small { opacity: .75; font-size: 14px; }
  .barra { width: 150px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
  .barra i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px; background: #6be52e; box-shadow: 0 0 10px #6be52e; animation: corre 1.1s ease-in-out infinite; }
  @keyframes corre { 0% { left: -40%; } 100% { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .splash .marca .tr { animation: none; stroke-dashoffset: 0; } .barra i { animation-duration: 2.5s; } }
  #erro { display: none; max-width: 300px; line-height: 1.4; }
  #erro button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; font-size: 16px; background: #6be52e; color: #0b0b0b; }
</style>
</head>
<body>
<div class="splash">
  <svg class="marca" viewBox="-4 -4 108 108" aria-hidden="true"><defs><linearGradient id="vv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9dff5c"/><stop offset=".5" stop-color="#5fe022"/><stop offset="1" stop-color="#2fae10"/></linearGradient></defs><g class="bv"><g><path d="M68.1 9.9A44 44 0 0 0 19.4 81.7L42 49L19 35Z" fill="none" class="tr" stroke="#185e08" stroke-width="10"/><path d="M68.1 9.9A44 44 0 0 0 19.4 81.7L42 49L19 35Z" fill="none" class="tr" stroke="url(#vv)" stroke-width="7"/><path d="M68.1 9.9A44 44 0 0 0 19.4 81.7L42 49L19 35Z" fill="none" class="tr" stroke="#d9ffb8" stroke-width="1.6" stroke-opacity=".75"/></g><g transform="rotate(180 50 50)"><path d="M68.1 9.9A44 44 0 0 0 19.4 81.7L42 49L19 35Z" fill="none" class="tr" stroke="#185e08" stroke-width="10"/><path d="M68.1 9.9A44 44 0 0 0 19.4 81.7L42 49L19 35Z" fill="none" class="tr" stroke="url(#vv)" stroke-width="7"/><path d="M68.1 9.9A44 44 0 0 0 19.4 81.7L42 49L19 35Z" fill="none" class="tr" stroke="#d9ffb8" stroke-width="1.6" stroke-opacity=".75"/></g></g></svg>
  <b>Força Teen</b>
  <div class="barra" id="barra"><i></i></div>
  <small id="msg">Carregando...</small>
  <div id="erro">Não deu pra conectar agora. Confere a internet e tenta de novo.<br><button onclick="location.reload()">Tentar de novo</button></div>
</div>
<script>
  // O "salão" do Força Teen: esta página abre na hora e busca a tela do app na "cozinha" (Google Apps Script).
  var API = 'https://script.google.com/macros/s/AKfycby_w7m1eiD_gHxD5GV0OdPoOHP89R3KsM2xwqJN1mObH53_ihz47rF3HHNzGU-VjoI6/exec';
  var CHAVE = 'wego_pagina';

  function guardar(html) { try { localStorage.setItem(CHAVE, html); } catch (e) {} }

  function buscar() {
    return fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'pagina', args: [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.erro || 'erro'); guardar(j.r); return j.r; });
  }

  function montar(html, atualizarDepois) {
    var extra =
      '<script>window.WEGO_API=' + JSON.stringify(API) + ';' +
      'if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}' +
      (atualizarDepois
        ? 'setTimeout(function(){fetch(WEGO_API,{method:"POST",body:JSON.stringify({fn:"pagina",args:[]})}).then(function(r){return r.json();}).then(function(j){if(j.ok){var velho=null;try{velho=localStorage.getItem("' + CHAVE + '");}catch(e){}try{localStorage.setItem("' + CHAVE + '",j.r);}catch(e){}if(velho&&velho!==j.r){var b=document.createElement("button");b.textContent="\u2728 Tem novidade no Força Teen! Toque pra atualizar";b.style.cssText="position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:2147483000;border:0;border-radius:30px;padding:13px 20px;font:800 15px system-ui,sans-serif;color:#111;background:#ffd23f;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;cursor:pointer";b.onclick=function(){location.reload();};document.body.appendChild(b);}}}).catch(function(){});},5000);'
        : '') +
      '<\/script>' +
      '<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a12a8">' +
      '<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1nL_BWieThlbpY-YCyEgXyW2W0kLHZixM">' +
      '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
      '<meta name="apple-mobile-web-app-title" content="Força Teen">';
    html = html.replace('<base target="_top">', '').replace('<head>', '<head>' + extra);
    document.open();
    document.write(html);
    document.close();
  }

  var salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) {}

  if (salvo) {
    // Abre na hora com a versão guardada no celular e atualiza por trás pra próxima vez.
    // Espera a página terminar de carregar pra trocar a tela inteira (senão a tela de "Carregando" fica por baixo).
    var abrirSalvo = function () { montar(salvo, true); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', abrirSalvo);
    else abrirSalvo();
  } else {
    buscar().then(function (html) { montar(html, false); }).catch(function () {
      document.getElementById('msg').style.display = 'none'; document.getElementById('barra').style.display = 'none';
      document.getElementById('erro').style.display = 'block';
    });
  }
</script>
</body>
</html>
