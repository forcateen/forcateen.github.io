<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForTeen</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1nSdb9ZpMKVBccjFBEMVh1_FsQg3gsh2u">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ForTeen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0b; font-family: system-ui, -apple-system, sans-serif; }
  .splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: #fff; text-align: center; padding: 24px;
    background: radial-gradient(rgba(255,255,255,.05) 1.2px, transparent 1.5px) 0 0 / 7px 7px, linear-gradient(160deg, #222222, #050505);
  }
  .splash img { width: 140px; height: 140px; filter: drop-shadow(0 0 18px rgba(107,229,46,.5)); border-radius: 32px; animation: pulsa 1.2s ease-in-out infinite; }
  .splash b { font-size: 36px; letter-spacing: .02em; }
  .splash small { opacity: .8; font-size: 15px; }
  @keyframes pulsa { 50% { transform: scale(1.06); } }
  #erro { display: none; max-width: 300px; line-height: 1.4; }
  #erro button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; font-size: 16px; background: #6be52e; color: #0b0b0b; }
</style>
</head>
<body>
<div class="splash">
  <img src="logo.svg" alt="">
  <b>ForTeen</b>
  <small id="msg">Carregando...</small>
  <div id="erro">Não deu pra conectar agora. Confere a internet e tenta de novo.<br><button onclick="location.reload()">Tentar de novo</button></div>
</div>
<script>
  // O "salão" do ForTeen: esta página abre na hora e busca a tela do app na "cozinha" (Google Apps Script).
  var API = 'https://script.google.com/macros/s/AKfycby_w7m1eiD_gHxD5GV0OdPoOHP89R3KsM2xwqJN1mObH53_ihz47rF3HHNzGU-VjoI6/exec';
  var CHAVE = 'wego_pagina';

  function guardar(html) { try { localStorage.setItem(CHAVE, html); } catch (e) {} }

  function buscar() {
    return fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'pagina', args: [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.erro || 'erro'); guardar(j.r); return j.r; });
  }

  function montar(html, atualizarDepois) {
    var extra =
      '<script>window.WEGO_API=' + JSON.stringify(API) + ';' +
      'if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}' +
      (atualizarDepois
        ? 'setTimeout(function(){fetch(WEGO_API,{method:"POST",body:JSON.stringify({fn:"pagina",args:[]})}).then(function(r){return r.json();}).then(function(j){if(j.ok){var velho=null;try{velho=localStorage.getItem("' + CHAVE + '");}catch(e){}try{localStorage.setItem("' + CHAVE + '",j.r);}catch(e){}if(velho&&velho!==j.r){var b=document.createElement("button");b.textContent="\u2728 Tem novidade no ForTeen! Toque pra atualizar";b.style.cssText="position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:2147483000;border:0;border-radius:30px;padding:13px 20px;font:800 15px system-ui,sans-serif;color:#111;background:#ffd23f;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;cursor:pointer";b.onclick=function(){location.reload();};document.body.appendChild(b);}}}).catch(function(){});},5000);'
        : '') +
      '<\/script>' +
      '<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a12a8">' +
      '<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1nSdb9ZpMKVBccjFBEMVh1_FsQg3gsh2u">' +
      '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
      '<meta name="apple-mobile-web-app-title" content="ForTeen">';
    html = html.replace('<base target="_top">', '').replace('<head>', '<head>' + extra);
    document.open();
    document.write(html);
    document.close();
  }

  var salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) {}

  if (salvo) {
    // Abre na hora com a versão guardada no celular e atualiza por trás pra próxima vez.
    // Espera a página terminar de carregar pra trocar a tela inteira (senão a tela de "Carregando" fica por baixo).
    var abrirSalvo = function () { montar(salvo, true); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', abrirSalvo);
    else abrirSalvo();
  } else {
    buscar().then(function (html) { montar(html, false); }).catch(function () {
      document.getElementById('msg').style.display = 'none';
      document.getElementById('erro').style.display = 'block';
    });
  }
</script>
</body>
</html>
